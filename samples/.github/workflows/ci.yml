name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  GO_VERSION: "1.27"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Test
        run: |
          go vet ./...
          go test -race ./...
      - name: Build
        if: github.event_name == 'push'
        run: go run ./cmd/build
