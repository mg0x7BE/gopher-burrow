services:
  api: &service
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://app:${DB_PASSWORD}@db:5432/inventory?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    <<: *service
    command: ["/app/worker", "--interval", "30s"]

  db:
    image: postgres:17
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app"]
      interval: 5s

volumes:
  pgdata: {}
