name: Release

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency: release

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.version.outputs.released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check if the newest CHANGELOG version is already released
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(go run ./cmd/build -version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already released, nothing to do"
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.released == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run ./cmd/build
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          go run ./cmd/build -notes > notes.md
          cp build-zed/themes/gopher-burrow.json "gopher-burrow-zed-$VERSION.json"
          gh release create "v$VERSION" build-jetbrains/*.jar "gopher-burrow-zed-$VERSION.json" \
            --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md
