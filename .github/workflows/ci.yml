name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go run ./cmd/build
      - name: Check build-zed is up to date
        run: |
          if [ -n "$(git status --porcelain build-zed)" ]; then
            echo "build-zed is out of date, run go run ./cmd/build and commit it"
            git status --short build-zed
            exit 1
          fi
